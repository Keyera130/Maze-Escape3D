<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maze Escape 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0f7fa;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 24px;
      pointer-events: none;
      z-index: 10;
    }

    .hud-panel {
      background: rgba(0,20,30,0.75);
      border: 1px solid #00e5ff44;
      border-radius: 4px;
      padding: 10px 18px;
      backdrop-filter: blur(6px);
    }

    .hud-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: #00e5ff;
      letter-spacing: 3px;
      text-shadow: 0 0 12px #00e5ff88;
    }

    .hud-stat {
      font-size: 13px;
      color: #80deea;
      margin-top: 4px;
    }

    .hud-stat span {
      color: #00e5ff;
      font-weight: bold;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #glCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(0,229,255,0.8);
    }
    #crosshair::before {
      width: 2px; height: 14px;
      top: -7px; left: -1px;
    }
    #crosshair::after {
      width: 14px; height: 2px;
      top: -1px; left: -7px;
    }

    /* Start Screen Overlay */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(5,5,15,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    #start-screen h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(28px, 5vw, 56px);
      color: #00e5ff;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #00e5ffaa, 0 0 60px #00e5ff44;
      margin-bottom: 12px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px #00e5ffaa, 0 0 50px #00e5ff44; }
      50%       { text-shadow: 0 0 40px #00e5ffcc, 0 0 90px #00e5ff66; }
    }

    #start-screen p {
      color: #80deea;
      font-size: 14px;
      margin: 6px 0;
      letter-spacing: 1px;
    }

    #start-screen .keys {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 8px 24px;
      text-align: left;
    }

    .key-hint {
      font-size: 13px;
      color: #b2ebf2;
    }

    .key-hint kbd {
      background: #00e5ff22;
      border: 1px solid #00e5ff55;
      border-radius: 3px;
      padding: 2px 7px;
      color: #00e5ff;
      font-family: inherit;
      font-size: 12px;
    }

    #start-btn {
      margin-top: 36px;
      padding: 14px 40px;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      letter-spacing: 4px;
      color: #0a0a0f;
      background: #00e5ff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      box-shadow: 0 0 24px #00e5ff66;
    }

    #start-btn:hover {
      background: #40f4ff;
      box-shadow: 0 0 36px #00e5ffaa;
      transform: translateY(-2px);
    }

    /* Win Screen */
    #win-screen {
      position: absolute;
      inset: 0;
      background: rgba(5,5,15,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #win-screen h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      color: #69ff47;
      text-shadow: 0 0 30px #69ff4788;
      letter-spacing: 4px;
    }

    #win-screen p {
      color: #b9f6ca;
      margin-top: 12px;
      font-size: 15px;
    }

    #restart-btn {
      margin-top: 28px;
      padding: 12px 32px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: #0a0a0f;
      background: #69ff47;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 20px #69ff4766;
      transition: transform 0.1s;
    }
    #restart-btn:hover { transform: translateY(-2px); }

    /* Collectible flash */
    #collect-flash {
      position: absolute;
      inset: 0;
      background: rgba(0,229,255,0.08);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 8;
    }
    #collect-flash.flash { opacity: 1; }
  </style>
</head>
<body>

<div id="canvas-container">
  <canvas id="glCanvas"></canvas>
  <div id="crosshair"></div>
  <div id="collect-flash"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-panel">
      <div class="hud-title">MAZE ESCAPE 3D</div>
      <div class="hud-stat">Collectibles: <span id="hud-collected">0</span> / <span id="hud-total">0</span></div>
    </div>
    <div class="hud-panel">
      <div class="hud-stat">Exit: <span id="hud-exit-status">LOCKED</span></div>
      <div class="hud-stat">Time: <span id="hud-time">0:00</span></div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <h1>MAZE ESCAPE 3D</h1>
    <p>Find all collectibles, then reach the exit.</p>
    <div class="keys">
      <span class="key-hint"><kbd>W A S D</kbd> Move</span>
      <span class="key-hint"><kbd>Mouse</kbd> Look</span>
      <span class="key-hint"><kbd>R</kbd> Restart</span>
    </div>
    <button id="start-btn" onclick="startGame()">ENTER MAZE</button>
  </div>

  <!-- Win Screen -->
  <div id="win-screen">
    <h2>ESCAPED!</h2>
    <p id="win-time">You escaped in 0:00</p>
    <button id="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
  </div>
</div>

<!-- Shaders -->
<script id="vertex-shader" type="x-shader/x-vertex">
  attribute vec3 a_position;
  attribute vec3 a_normal;
  attribute vec2 a_texCoord;

  uniform mat4 u_modelMatrix;
  uniform mat4 u_viewMatrix;
  uniform mat4 u_projMatrix;
  uniform mat3 u_normalMatrix;

  varying vec3 v_normal;
  varying vec3 v_fragPos;
  varying vec2 v_texCoord;

  void main() {
    vec4 worldPos = u_modelMatrix * vec4(a_position, 1.0);
    v_fragPos    = worldPos.xyz;
    v_normal     = normalize(u_normalMatrix * a_normal);
    v_texCoord   = a_texCoord;
    gl_Position  = u_projMatrix * u_viewMatrix * worldPos;
  }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
  precision mediump float;

  varying vec3 v_normal;
  varying vec3 v_fragPos;
  varying vec2 v_texCoord;

  uniform vec3  u_lightPos;
  uniform vec3  u_lightColor;
  uniform vec3  u_viewPos;
  uniform vec3  u_objectColor;
  uniform bool  u_useTexture;
  uniform sampler2D u_texture;

  // Phong lighting
  void main() {
    vec3 baseColor = u_useTexture
      ? texture2D(u_texture, v_texCoord).rgb
      : u_objectColor;

    // Ambient
    float ambientStrength = 0.25;
    vec3 ambient = ambientStrength * u_lightColor * baseColor;

    // Diffuse
    vec3 norm     = normalize(v_normal);
    vec3 lightDir = normalize(u_lightPos - v_fragPos);
    float diff    = max(dot(norm, lightDir), 0.0);
    vec3 diffuse  = diff * u_lightColor * baseColor;

    // Specular
    float specularStrength = 0.4;
    vec3 viewDir  = normalize(u_viewPos - v_fragPos);
    vec3 reflDir  = reflect(-lightDir, norm);
    float spec    = pow(max(dot(viewDir, reflDir), 0.0), 32.0);
    vec3 specular = specularStrength * spec * u_lightColor;

    vec3 result = ambient + diffuse + specular;
    gl_FragColor = vec4(result, 1.0);
  }
</script>

<!-- JS Modules -->
<script src="js/utils.js"></script>
<script src="js/maze.js"></script>
<script src="js/objects.js"></script>
<script src="js/camera.js"></script>
<script src="js/collision.js"></script>
<script src="js/lighting.js"></script>
<script src="js/main.js"></script>

</body>
</html>
